<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
/* 상태 색은 오르카 앱이 쓰는 값 그대로(main.css 의 --agent-question · --agent-working · --status-success · --ai-action-accent). 테마 밝기를 따라 바뀐다 */
:root{--wait:#ea580c;--busy:#2563eb;--done:#147638;--now:#eab308;--side:#8b5cf6;
  --bg:var(--orca-background);--fg:var(--orca-foreground);--card:var(--orca-card);--line:var(--orca-border);--mut:var(--orca-muted-foreground);
  --left:color-mix(in srgb,var(--mut) 70%,transparent);--soft:color-mix(in srgb,var(--fg) 5%,transparent);
  --grp:color-mix(in srgb,var(--fg) 3%,var(--bg));--acc:var(--orca-accent);--accfg:var(--orca-accent-foreground);
  --pri:var(--orca-primary);--prifg:var(--orca-primary-foreground);--des:var(--orca-destructive,#e5534b);--rmd:calc(var(--orca-radius,10px) - 2px)}
/* 오르카 Button 과 같은 규격 (ui/button.tsx 의 xs · default · ghost · destructive-chip) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--rmd);font-size:12px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--orca-ring) 50%,transparent)}
.btn.pri{background:var(--pri);color:var(--prifg)}.btn.pri:hover{background:color-mix(in srgb,var(--pri) 90%,transparent)}
.btn.ghost{color:var(--mut)}.btn.ghost:hover{background:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--accfg)}
.btn.dchip{border:1px solid color-mix(in srgb,var(--des) 40%,transparent);background:color-mix(in srgb,var(--des) 10%,transparent);color:var(--des)}
.btn.dchip:hover{background:color-mix(in srgb,var(--des) 15%,transparent)}
.btn.dghost{color:var(--des)}.btn.dghost:hover{background:color-mix(in srgb,var(--des) 10%,transparent)}
.btn.out{border:1px solid var(--orca-input,var(--line));background:color-mix(in srgb,var(--orca-input,var(--line)) 30%,transparent);color:var(--fg)}.btn.out:hover{background:color-mix(in srgb,var(--orca-input,var(--line)) 50%,transparent)}
/* My turn(주황)과 Working(파랑)은 한눈에 갈리게 다른 계열로 둔다. 둘 다 오르카가 쓰는 색(질문 주황 · 위치 표시 파랑). 지금 단계 점만 오르카의 작업 노랑 */
:root{--waittx:#c2410c;--busytx:#1d4ed8}
html.dark{--wait:#f97316;--busy:#60a5fa;--done:#86efac;--side:#a78bfa;--waittx:#fb923c;--busytx:#60a5fa}
/* 색 묶음끼리도, 한 묶음 안의 My turn · Working 끼리도 서로 다른 계열로 둔다 */
/* Neon: 분홍 · 연두 */
html[data-pal=neon]{--wait:#db2777;--busy:#4d7c0f;--done:#0891b2;--now:#ca8a04;--side:#7c3aed;--waittx:#be185d;--busytx:#3f6212}
html.dark[data-pal=neon]{--wait:#ff2d95;--busy:#a3e635;--done:#22d3ee;--now:#facc15;--side:#c084fc;--waittx:#ff4fa7;--busytx:#a3e635}
/* Grape: 보라 · 청록 */
html[data-pal=grape]{--wait:#9333ea;--busy:#0f766e;--done:#16a34a;--now:#d97706;--side:#db2777;--waittx:#7e22ce;--busytx:#0f766e}
html.dark[data-pal=grape]{--wait:#c084fc;--busy:#2dd4bf;--done:#4ade80;--now:#fbbf24;--side:#f472b6;--waittx:#d8b4fe;--busytx:#2dd4bf}
/* Alert: My turn 만 빨강, Working 은 회색. 내 차례만 튄다 */
html[data-pal=alert]{--wait:#dc2626;--busy:#737373;--done:#525252;--now:#a3a3a3;--side:#737373;--waittx:#b91c1c;--busytx:#525252}
html.dark[data-pal=alert]{--wait:#f43f5e;--busy:#8a8a8a;--done:#a3a3a3;--now:#d4d4d4;--side:#8a8a8a;--waittx:#fb7185;--busytx:#a3a3a3}
/* Color-blind safe: 노랑 · 파랑(색약에도 가장 잘 갈리는 짝) */
html[data-pal=cvd]{--wait:#b8960b;--busy:#0072b2;--done:#009e73;--now:#d55e00;--side:#cc79a7;--waittx:#8a6d00;--busytx:#0072b2}
html.dark[data-pal=cvd]{--wait:#f0e442;--busy:#56b4e9;--done:#2ec4a0;--now:#e69f00;--side:#e08cba;--waittx:#f0e442;--busytx:#56b4e9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:13px/1.5 'Geist',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 스크롤바: 얇고, 바탕 없이, 올렸을 때만 진하게 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 16%,transparent);border:3px solid transparent;border-radius:6px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.wrap{padding:0 10px 24px}

/* 머리 한 줄: 필터 탭 + 보기 메뉴 */
.head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 0 9px;background:var(--bg)}
.tabs{flex:1;min-width:0;display:flex;gap:2px}
.tab{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:var(--rmd);font-size:13px;font-weight:500;color:var(--mut);white-space:nowrap;transition:background-color .15s,color .15s}
.tab b{font-weight:600;font-size:11.5px;color:var(--mut);background:var(--soft);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.tab:hover{color:var(--accfg);background:color-mix(in srgb,var(--acc) 50%,transparent)}
.tab.on{color:var(--accfg);background:var(--acc)}
.tab.on b{color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent)}
.tab.wait.on b{background:var(--wait);color:#fff}
.vbtn{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--rmd);color:var(--mut)}
.vbtn svg{width:14px;height:14px}
.vbtn:hover,.vbtn.on{background:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--accfg)}
.menu{position:absolute;right:0;top:38px;z-index:9;min-width:170px;padding:4px;border-radius:var(--orca-radius,10px);background:var(--orca-popover,var(--card));color:var(--orca-popover-foreground,var(--fg));border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.menu h5{margin:6px 8px 3px;font-size:10.5px;font-weight:600;color:var(--mut)}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;height:28px;padding:0 8px;border-radius:calc(var(--orca-radius,10px) - 4px);font-size:12px;text-align:left}
.menu button:hover{background:var(--acc);color:var(--accfg)}
.menu button.on:after{content:"✓";color:var(--mut)}
.menu h6{margin:6px 8px 2px;font-size:10.5px;font-weight:500;color:var(--mut)}
.menu .msub{gap:6px}.menu .msub span{flex:1}.menu .msub em{font-style:normal;color:var(--mut);font-size:11.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .mback{justify-content:flex-start;gap:6px;color:var(--mut)}.menu .mback .chev{transform:rotate(135deg)}
.mnote{margin:6px 8px 4px;font-size:11px;color:var(--mut);line-height:1.4}
.menu{max-height:min(420px,80vh);overflow:auto}
.sw{display:flex;align-items:center;gap:4px}.sw i{width:10px;height:10px;border-radius:3px;display:inline-block}.sw i.b{margin-right:6px}
.p-orca.w{background:#f97316}.p-orca.b{background:#60a5fa}.p-neon.w{background:#ff2d95}.p-neon.b{background:#a3e635}.p-grape.w{background:#c084fc}.p-grape.b{background:#2dd4bf}.p-alert.w{background:#f43f5e}.p-alert.b{background:#8a8a8a}.p-cvd.w{background:#f0e442}.p-cvd.b{background:#56b4e9}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.sorting{font-size:12px;color:var(--mut);margin:0 2px 8px}

/* 칸(워크스페이스 또는 주제) */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px;align-items:start}
.board>.ws{margin-bottom:0}
.ws{background:var(--grp);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--orca-radius,10px);padding:7px;margin-bottom:9px}
.wsh{display:flex;align-items:center;gap:6px;width:100%;padding:1px 4px 7px;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--fg) 82%,transparent)}
.wsh .n{color:var(--mut);font-weight:500}.wsh .car{margin-left:auto}
.ws.shut .wsh{padding-bottom:1px}
.chev{display:inline-block;width:6px;height:6px;border:solid var(--mut);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
.chev.right{transform:rotate(-45deg)}

/* 카드 */
.c{position:relative;background:var(--card);border-radius:var(--rmd);padding:9px 11px 9px 13px;margin-top:6px;cursor:pointer;border:1px solid transparent;transition:border-color .15s ease,transform .15s ease}
.cards>.c:first-child{margin-top:0}
.c:hover{border-color:var(--line);transform:translateY(-1px)}
.c:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px;background:var(--busy)}
.c.wait:before{background:var(--wait)}
.c.changed{animation:changed 1.4s ease}
.c.fresh{animation:fresh .45s cubic-bezier(.16,1,.3,1)}
@keyframes changed{0%{box-shadow:0 0 0 2px color-mix(in srgb,var(--st,var(--busy)) 60%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fresh{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c.wait{--st:var(--wait)}
@media (prefers-reduced-motion:reduce){.c{animation:none!important;transition:none}}
.hd{display:flex;align-items:center;gap:6px}
.st{font-size:11.5px;font-weight:600;color:var(--busytx);background:color-mix(in srgb,var(--busy) 15%,transparent);border-radius:4px;padding:0 6px;line-height:18px}
.wait .st,.st.wait{color:var(--waittx);background:color-mix(in srgb,var(--wait) 16%,transparent)}
.c.wait{background:color-mix(in srgb,var(--wait) 6%,var(--card))}
.c:before{width:4px}
.md{font-size:11px;color:var(--mut);background:var(--soft);border-radius:4px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{margin-left:auto;font-size:11.5px;color:var(--mut);white-space:nowrap}
.ti{font-weight:600;font-size:14px;margin:4px 0 6px;line-height:1.35;word-break:break-word}
.warn{font-size:11.5px;color:var(--now);margin:-2px 0 4px}
ul.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:color-mix(in srgb,var(--fg) 75%,transparent);position:relative;padding:2px 0}
.steps li i{width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--done);flex:none;position:relative;z-index:1}
.steps li:not(:last-child):after{content:"";position:absolute;left:4.5px;top:16px;bottom:-4px;width:1px;background:var(--done)}
.steps li.now{color:var(--fg);font-weight:600}.steps li.now i{background:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 28%,transparent)}
.steps li.side i{background:var(--side)}
.steps li.left{color:var(--mut)}.steps li.left i{background:transparent;border:1.5px solid var(--left)}
.steps li.now:after,.steps li.left:after{background:var(--left)}
.steps li.gap{color:var(--mut);font-size:12px}.steps li.gap i{background:none;text-align:center;font-style:normal;line-height:8px;margin-top:2px}
.steps li.gap:after{background:var(--left)}
.steps small{display:block;color:var(--mut);font-size:12px;font-weight:400;line-height:1.4;margin-top:1px}
.steps.full li{padding:3px 0 7px}
.steps.full li>div{color:var(--fg);font-weight:600}
.steps.full li.left>div{color:color-mix(in srgb,var(--fg) 70%,transparent)}
.steps.full li.now>div{color:var(--fg)}
.subs{font-size:12px;color:var(--mut);margin-top:3px}
.cact{display:flex;justify-content:space-between;align-items:center;max-height:0;opacity:0;overflow:hidden;margin:0 -4px;transition:max-height .18s ease,opacity .15s ease,margin .18s ease}
.c:hover .cact,.c.ask .cact,.c:focus-within .cact{max-height:30px;opacity:1;margin:6px -4px -2px}
.cact .btn{height:22px;font-size:11.5px}
.c.dragging{opacity:.35}
.c.floating{position:fixed;left:0;top:0;z-index:20;pointer-events:none;margin:0;box-shadow:0 18px 40px rgba(0,0,0,.35);border-color:var(--line)}
body.dragging-on{user-select:none;cursor:grabbing}
.ws.newcol{border:1.5px dashed color-mix(in srgb,var(--mut) 50%,transparent);background:transparent;min-height:56px}
.ws.newcol .wsh{color:var(--mut);padding:10px 6px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 12px}
.dlg{width:100%;max-width:340px;background:var(--orca-popover,var(--card));color:var(--orca-popover-foreground,var(--fg));border:1px solid var(--line);border-radius:var(--orca-radius,10px);padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 10px;font-size:13px}
.nm{width:100%;height:30px;padding:0 9px;border-radius:var(--rmd);border:1px solid var(--orca-input,var(--line));background:color-mix(in srgb,var(--orca-input,var(--line)) 30%,transparent);color:var(--fg);font:inherit;font-size:13px;outline:none}
.nm:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--orca-ring) 50%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 2px;min-height:22px}
.chip{height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);background:var(--soft)}
.chip:hover{background:var(--acc)}.chip.old{color:var(--mut);border-style:dashed}
.pks{display:grid;gap:2px;max-height:260px;overflow:auto}
.pk{display:block;text-align:left;padding:6px 8px;border-radius:var(--rmd)}.pk b{display:block;font-size:12.5px;font-weight:500}.pk small{color:var(--mut);font-size:11px}
.pk:hover{background:color-mix(in srgb,var(--acc) 50%,transparent)}.pk.on{background:var(--acc);color:var(--accfg)}
.dbtns{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.ws.drop{outline:2px dashed color-mix(in srgb,var(--wait) 60%,transparent);outline-offset:-2px}
.empty{color:var(--mut);font-size:13px;padding:24px 8px;text-align:center;line-height:1.6}

/* 상세 */
.dfoot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;margin:18px -10px -24px;padding:8px 10px 10px;background:var(--bg);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.dfoot .backb{flex:1;height:28px;font-size:12.5px}.dfoot .backb .chev{transform:rotate(135deg);margin-right:2px}
.dfoot .hint{font-size:11px;color:var(--mut);white-space:nowrap}
@media (max-width:280px){.dfoot .hint{display:none}}
.dbar{display:flex;align-items:center;gap:6px;padding:10px 0 8px;background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);margin-bottom:10px}
.back .chev{transform:rotate(135deg);margin:0 1px 0 3px}
.drow{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.drow .wsn{font-weight:600;color:color-mix(in srgb,var(--fg) 80%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .wh{color:var(--mut);white-space:nowrap}
.hero{display:flex;gap:10px;margin-top:10px}
.ring{flex:none;width:38px;height:38px}
.hero h2{margin:0;font-size:15px;line-height:1.35;word-break:break-word}
.sum{margin:4px 0 0;font-size:12.5px;color:var(--mut);line-height:1.4}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.mline{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:2px}
.sid.btn{height:22px;padding:0 6px;font-size:11.5px;font-weight:400;font-family:ui-monospace,Menlo,monospace}
h4{margin:20px 0 8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ask{font-size:12.5px;margin:0 0 5px;color:color-mix(in srgb,var(--fg) 80%,transparent)}.ask b{color:var(--mut);font-weight:600;margin-right:4px}
.box{background:color-mix(in srgb,var(--fg) 3%,var(--card));border:1px solid var(--line);border-radius:var(--rmd);padding:9px 10px;font-size:12.5px;line-height:1.5;word-break:break-word}
details{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);color:var(--mut);font-size:11px}
details summary{cursor:pointer}
details pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--fg);margin:6px 0 0}
.helper{margin-bottom:6px}.helper p{margin:3px 0 6px;color:var(--mut);font-size:12px}
.helper .b{display:flex;gap:6px}.helper .b .btn{height:22px;font-size:11.5px}
ul.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo li{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.todo li b{flex:none;width:14px;height:14px;border:1.5px solid var(--mut);border-radius:4px;margin-top:3px;position:relative}
.todo li:hover b{border-color:var(--fg)}
.todo li.done{color:var(--mut);text-decoration:line-through}.todo li.done b{background:var(--done);border-color:var(--done)}
.todo li.done b:after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.todo em{font-style:normal;font-size:10px;color:var(--now);margin-left:5px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:-2px 2px 10px;font-size:11.5px;color:var(--mut)}
.foot span{display:inline-flex;align-items:center;gap:5px}
.lg{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.lg.done{background:var(--done)}.lg.now{background:var(--now)}.lg.side{background:var(--side)}.lg.left{border:1.5px solid var(--left)}
.foot .upd{margin-left:auto}
/* 좁은 폭: 머리 줄이 안 겹치게, 상태 글자가 꺾이지 않게 */
.st{white-space:nowrap}.md{min-width:0;flex:0 1 auto}.hd{min-width:0}
@media (max-width:300px){.tab{padding:0 5px;gap:3px;font-size:12px}.tab b{padding:0 4px;min-width:16px}.head{gap:2px}}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--orca-popover,var(--card));color:var(--orca-popover-foreground,var(--fg));border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<div class="toast" id="toast"></div>
<script>
const app = document.getElementById('app')
const S = { data: null, error: '', view: 'list', sel: '', filter: 'all', shut: new Set(), ask: '', listY: 0, full: '', menu: false, pal: 'orca', cfg: null }
const LABEL = { wait: 'My turn', busy: 'Working' }
let seen = null // 카드별 지난 내용. 바뀐 카드만 반짝이게 하려고 둔다
let flash = new Map()

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v)
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : String(k))
  return n
}
function svgIcon(d) {
  const ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg')
  Object.entries({ width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => s.setAttribute(k, v))
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); s.append(p); return s
}
function ago(sec) {
  const d = Math.max(0, Date.now() / 1000 - (sec || 0))
  return d < 60 ? 'now' : d < 3600 ? Math.floor(d / 60) + 'm' : d < 86400 ? Math.floor(d / 3600) + 'h' : Math.floor(d / 86400) + 'd'
}
function toast(t) {
  const n = document.getElementById('toast'); n.textContent = t; n.classList.add('on')
  clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove('on'), 1800)
}
async function req(name, input) {
  try { return await orca.plugin.request(name, input || {}) }
  catch (e) { toast((e && e.message) || 'Failed'); throw e }
}
const key = (s) => s.log || s.handle
const cleanAsk = (t) => (t || '').replace(/<(system-reminder|command-[a-z-]+|local-command-[a-z-]+)>[\s\S]*?(<\/\1>|$)/g, '').replace(/^This session is being continued from a previous conversation[\s\S]*/, '').trim() // 시스템이 넣은 문구는 내가 한 말이 아니다
const arrow = () => { const i = svgIcon('M7 17L17 7M9 7h8v8'); i.setAttribute('width', 11); i.setAttribute('height', 11); return i }
const sig = (s) => JSON.stringify([s.status, s.title, s.steps, s.todo, s.reply, (s.subs || []).map((x) => x.state)])

// 카드에 보이는 단계: 바로 앞 1개 · 지금 · 다음 1개 (지금이 없으면 다음 할 일, 그것도 없으면 마지막 셋). 전체는 상세에서
function windowOf(steps) {
  if (steps.length <= 3) return [0, steps.length]
  let p = steps.findIndex((f) => f.state === 'now' || f.state === 'blocked')
  if (p < 0) p = steps.findIndex((f) => f.state === 'left')
  if (p < 0) p = steps.length - 1
  const a = Math.max(0, Math.min(p - 1, steps.length - 3))
  return [a, a + 3]
}
function stepLi(f, withDetail) {
  return el('li', { class: f.state === 'blocked' ? 'now' : f.state }, el('i'), el('div', {}, f.label, withDetail && f.detail ? el('small', {}, f.detail) : null))
}

function card(s) {
  const steps = s.steps || [], [a, b] = windowOf(steps), sub = (s.subs || [])[0], asking = S.ask === s.handle
  const stop = (fn) => (e) => { e.stopPropagation(); fn() }
  const act = el('div', { class: 'cact' },
    asking
      ? [el('button', { class: 'btn dchip', onclick: stop(() => endSession(s.handle)) }, 'End this session'), el('button', { class: 'btn ghost', onclick: stop(() => { S.ask = ''; render() }) }, 'Cancel')]
      : [el('button', { class: 'btn dghost', onclick: stop(() => { S.ask = s.handle; render() }) }, 'End session'), el('button', { class: 'btn out', onclick: stop(() => goTo(s.handle)) }, 'Go to session', arrow())])
  return el('div', { class: ['c', s.status, asking && 'ask', flash.get(key(s))].filter(Boolean).join(' '), 'data-k': key(s), onclick: () => { if (!justDragged) openDetail(s) } },
    el('div', { class: 'hd' }, el('span', { class: 'st' }, LABEL[s.status] || s.status), s.model ? el('span', { class: 'md' }, s.model) : null, el('span', { class: 'tm' }, ago(s.since))),
    el('div', { class: 'ti' }, s.title || '(untitled)'),
    s.stuck ? el('div', { class: 'warn' }, 'No progress for a while') : null,
    s.fail ? el('div', { class: 'warn' }, 'Summary failed') : null,
    steps.length
      ? el('ul', { class: 'steps' },
          a > 0 ? el('li', { class: 'gap' }, el('i', {}, '⋮'), a + ' earlier step' + (a > 1 ? 's' : '')) : null,
          steps.slice(a, b).map((f) => stepLi(f, false)))
      : el('div', { class: 'subs' }, s.note || ''),
    sub ? el('div', { class: 'subs' }, '↳ ' + sub.who + ' · ', el('b', {}, sub.state === 'busy' ? 'Working' : 'Done')) : null,
    act)
}

// 보드와 같은 순서: 카드는 내 차례 먼저(Newest 면 최근에 내 차례가 된 것부터, Longest wait 면 오래 기다린 것부터), 칸은 맨 위 카드가 앞서는 칸부터
function sortKey(s, sort) {
  const o = s.order || [1, 0]
  return sort === 'recent' && o[0] === 0 ? [0, -o[1]] : o
}
const cmp = (x, y) => x[0] - y[0] || x[1] - y[1]

function header(all, sort, group) {
  const n = { wait: 0, busy: 0 }
  all.forEach((s) => { n[s.status] = (n[s.status] || 0) + 1 })
  const tab = (v, t, c) => el('button', { class: 'tab ' + v + (S.filter === v ? ' on' : ''), onclick: () => { S.filter = v; render() } }, t, el('b', {}, c))
  const opt = (on, t, fn) => el('button', { class: on ? 'on' : null, onclick: () => { S.menu = false; render(); fn() } }, t)
  return el('div', { class: 'head' },
    el('div', { class: 'tabs' }, tab('all', 'All', all.length), tab('wait', 'My turn', n.wait), tab('busy', 'Working', n.busy)),
    el('button', { class: 'vbtn' + (S.menu ? ' on' : ''), title: 'Sort and group', onclick: (e) => { e.stopPropagation(); S.menu = S.menu ? false : 'main'; render(); if (S.menu && !S.cfg) loadCfg() } },
      svgIcon('M3 6h18M6 12h12M10 18h4')),
    S.menu ? menu(sort, group, opt) : null)
}

const PALETTES = [['orca', 'Orca'], ['neon', 'Neon'], ['grape', 'Grape'], ['alert', 'Alert'], ['cvd', 'Color-blind safe']]
function menu(sort, group, opt) {
  const box = (...kids) => el('div', { class: 'menu', onclick: (e) => e.stopPropagation() }, ...kids)
  const back = () => el('button', { class: 'mback', onclick: () => { S.menu = 'main'; render() } }, el('i', { class: 'chev' }), 'Back')
  const sub = (t, v, page) => el('button', { class: 'msub', onclick: () => { S.menu = page; render(); if (page === 'sum') loadCfg() } }, el('span', {}, t), el('em', {}, v), el('i', { class: 'chev right' }))
  if (S.menu === 'colors') return box(back(), el('h5', {}, 'Status colors'),
    PALETTES.map(([id, t]) => el('button', { class: S.pal === id ? 'on' : null, onclick: () => setPal(id) },
      el('span', { class: 'sw' }, el('i', { class: 'p-' + id + ' w' }), el('i', { class: 'p-' + id + ' b' }), t))))
  if (S.menu === 'sum') {
    const c = S.cfg
    return box(back(), el('h5', {}, 'Summarizer'),
      !c ? el('p', { class: 'mnote' }, 'Loading…') :
      c.options.map((p) => [el('h6', {}, p.label), p.models.map((m) => opt(c.summarizer === m.id, m.name, () => setConfig({ summarizer: m.id }).then(loadCfg)))]),
      el('p', { class: 'mnote' }, 'Changing it re-sorts AI topics. Also changes the Spyhop app.'))
  }
  const cur = S.cfg && S.cfg.options.flatMap((p) => p.models).find((m) => m.id === S.cfg.summarizer)
  return box(
    el('h5', {}, 'Sort'),
    opt(sort === 'recent', 'Newest', () => setConfig({ sort: 'recent' })),
    opt(sort === 'wait', 'Longest wait', () => setConfig({ sort: 'wait' })),
    el('hr'),
    el('h5', {}, 'Group by'),
    opt(group !== 'ai', 'Location', () => setConfig({ group_by: 'location' })),
    opt(group === 'ai', 'AI topics', () => setConfig({ group_by: 'ai' })),
    el('hr'),
    sub('Status colors', (PALETTES.find((p) => p[0] === S.pal) || PALETTES[0])[1], 'colors'),
    sub('Summarizer', cur ? cur.name : '', 'sum'))
}

function footer(d) {
  const t = d.at ? new Date(d.at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : ''
  const lg = (c, t) => el('span', {}, el('i', { class: 'lg ' + c }), t)
  return el('div', { class: 'foot' }, lg('done', 'Done'), lg('now', 'Now'), lg('left', 'Next'), lg('side', 'Intercept'),
    t ? el('span', { class: 'upd', title: 'Spyhop ' + (d.version || '') }, 'Updated ' + t) : null)
}

function renderList() {
  const d = S.data, all = d.sessions || [], sort = d.sort || 'recent', group = d.group_by || 'location'
  let shown = all.filter((s) => S.filter === 'all' || s.status === S.filter).sort((x, y) => cmp(sortKey(x, sort), sortKey(y, sort)))
  const pending = group === 'ai' ? shown.filter((s) => s.ws === 'Unsorted') : []
  if (pending.length) shown = shown.filter((s) => s.ws !== 'Unsorted') // 보드처럼 분류 전 세션은 칸 없이 숫자만
  const groups = new Map()
  for (const s of shown) {
    const g = s.ws || 'Other'
    if (!groups.has(g)) groups.set(g, [])
    groups.get(g).push(s)
  }
  const body = groups.size
    ? [...groups].map(([g, list]) => {
        const shut = S.shut.has(g)
        const wid = group === 'ai' ? 'group:' + g : list[0].wid
        return el('div', { class: 'ws' + (shut ? ' shut' : ''), 'data-wid': wid },
          el('button', { class: 'wsh', onclick: () => { shut ? S.shut.delete(g) : S.shut.add(g); render() } }, g, el('span', { class: 'n' }, list.length), el('i', { class: 'chev car' + (shut ? ' right' : '') })),
          shut ? null : el('div', { class: 'cards' }, list.map(card)))
      })
    : el('p', { class: 'empty' }, all.length ? 'No sessions here.' : 'The sea is calm · no sessions running.')
  return [header(all, sort, group), footer(d), pending.length ? el('p', { class: 'sorting' }, pending.length + ' new · sorting') : null,
    groups.size ? el('div', { class: 'board' }, body) : body]
}

function ring(done, total) {
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg')
  svg.setAttribute('viewBox', '0 0 36 36'); svg.setAttribute('class', 'ring')
  const c = (stroke, dash) => { const e = document.createElementNS(ns, 'circle'); Object.entries({ cx: 18, cy: 18, r: 15.5, fill: 'none', stroke, 'stroke-width': 3, 'stroke-linecap': 'round', transform: 'rotate(-90 18 18)' }).forEach(([k, v]) => e.setAttribute(k, v)); if (dash) e.setAttribute('stroke-dasharray', dash); return e }
  svg.append(c('color-mix(in srgb, currentColor 16%, transparent)'), c('var(--done)', (total ? 97.4 * done / total : 0).toFixed(1) + ' 97.4'))
  const t = document.createElementNS(ns, 'text'); Object.entries({ x: 18, y: 21.5, 'text-anchor': 'middle', 'font-size': 9, fill: 'currentColor' }).forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = done + '/' + total
  svg.append(t); return svg
}

function renderDetail(s) {
  const steps = s.steps || [], todo = s.todo || [], subs = s.subs || [], log = (s.log || '').split('/').pop()
  const asking = S.ask === s.handle, where = s.where || 'Orca'
  return [
    el('div', { class: 'dbar' },
      el('div', { class: 'drow' }, el('span', { class: 'st ' + s.status }, LABEL[s.status] || s.status), el('span', { class: 'wsn' }, s.ws),
        (s.ws || '').endsWith(where) ? null : el('span', { class: 'wh' }, '· ' + where))),
    el('div', { class: 'hero' }, ring(s.done || 0, s.total || steps.length), el('div', {}, el('h2', {}, s.title || '(untitled)'), s.summary ? el('p', { class: 'sum' }, s.summary) : null)),
    el('div', { class: 'acts' },
      el('button', { class: 'btn pri', onclick: () => goTo(s.handle) }, 'Go to session', arrow()),
      asking
        ? [el('button', { class: 'btn dchip', onclick: () => endSession(s.handle) }, 'End this session'), el('button', { class: 'btn ghost', onclick: () => { S.ask = ''; render() } }, 'Cancel')]
        : el('button', { class: 'btn dghost', onclick: () => { S.ask = s.handle; render() } }, 'End session'),
      el('span', { class: 'mline' }, s.model || '', s.model && s.sid ? ' · ' : '',
        s.sid ? el('button', { class: 'btn ghost sid', title: 'Copy: ' + (s.resume || s.sid), onclick: () => req('spyhop.copy', { text: s.resume || s.sid }).then(() => toast('Copied: ' + (s.resume || s.sid))) }, 'ID ' + s.sid.slice(0, 8)) : null)),
    el('h4', {}, 'Steps'),
    steps.length ? el('ul', { class: 'steps full' }, steps.map((f) => stepLi(f, true))) : el('p', { class: 'sum' }, s.note || 'No steps yet'),
    (s.reply || s.full || cleanAsk(s.ask)) ? [el('h4', {}, 'Last reply'),
      cleanAsk(s.ask) ? el('p', { class: 'ask' }, el('b', {}, 'You asked'), cleanAsk(s.ask)) : null,
      el('div', { class: 'box' }, s.reply || (s.full || '').slice(0, 200),
        s.full ? el('details', { open: S.full === key(s) ? '' : null, ontoggle: (e) => { S.full = e.target.open ? key(s) : '' } }, el('summary', {}, 'Full reply'), el('pre', {}, s.full)) : null)] : null,
    subs.length ? [el('h4', {}, 'Helpers'), subs.map((h) => el('div', { class: 'box helper' },
      el('b', {}, h.who), ' · ' + (h.state === 'busy' ? 'Working' : 'Done'), el('p', {}, h.result || h.what),
      el('div', { class: 'b' }, el('button', { class: 'btn out', onclick: () => goTo(h.handle) }, 'Go', arrow()),
        h.state !== 'busy' ? el('button', { class: 'btn ghost', onclick: () => endSession(h.handle) }, 'Close') : null)))] : null,
    todo.length ? [el('h4', {}, 'TODO'), el('ul', { class: 'todo' }, todo.map((t) =>
      el('li', { class: t.state === 'done' ? 'done' : null, onclick: () => toggle(log, t) }, el('b'), el('span', {}, t.label, t.state === 'open' ? el('em', {}, 'Paused') : null))))] : null,
    el('div', { class: 'dfoot' },
      el('button', { class: 'btn out backb', onclick: closeDetail }, el('i', { class: 'chev' }), 'Back to board'),
      el('span', { class: 'hint' }, 'Esc · mouse back · swipe'))]
}

function render() {
  const keepY = window.scrollY
  app.replaceChildren()
  if (!S.data) {
    app.append(el('p', { class: 'empty' }, S.error === 'offline'
      ? ['Spyhop is not running.', el('br'), 'Open the Spyhop app and this list fills in.']
      : (S.error || 'Loading…')))
    return
  }
  const s = S.view === 'detail' && (S.data.sessions || []).find((x) => key(x) === S.sel)
  if (S.view === 'detail' && !s) S.view = 'list'
  app.append(...[S.view === 'detail' ? renderDetail(s) : renderList()].flat(3).filter(Boolean))
  window.scrollTo(0, keepY)
  flash = new Map() // 한 번만 반짝인다(클릭으로 다시 그릴 때 또 반짝이지 않게)
}

function openDetail(s) { S.listY = window.scrollY; S.view = 'detail'; S.sel = key(s); S.ask = ''; S.menu = false; render(); window.scrollTo(0, 0) }
function closeDetail() { S.view = 'list'; S.ask = ''; render(); window.scrollTo(0, S.listY) }

async function load() {
  try {
    const r = await orca.plugin.request('spyhop.state', {})
    if (r.error) { S.error = r.error; S.data = null } else { S.error = ''; S.data = r.state }
  } catch (e) { S.error = (e && e.message) || 'Could not reach the worker'; S.data = null }
  // 바뀐 카드는 테두리가 잠깐 빛나고, 새 카드는 미끄러져 들어온다(첫 화면은 그대로)
  flash = new Map()
  if (S.data) {
    const now = new Map((S.data.sessions || []).map((s) => [key(s), sig(s)]))
    if (seen) for (const [k, v] of now) { if (!seen.has(k)) flash.set(k, 'fresh'); else if (seen.get(k) !== v) flash.set(k, 'changed') }
    seen = now
  }
  if (S.menu || drag || S.dialog) return // 메뉴·창을 열었거나 카드를 끄는 동안은 다시 그리지 않는다
  render()
}
async function loadCfg() { S.cfg = await req('spyhop.getConfig', {}).catch(() => null); if (S.menu) render() }
function applyPal() { if (S.pal === 'orca') delete document.documentElement.dataset.pal; else document.documentElement.dataset.pal = S.pal }
async function setPal(id) { S.pal = id; applyPal(); render(); try { await orca.storage.set('palette', id) } catch {} }
async function setConfig(c) { await req('spyhop.config', c).catch(() => null); await load() }
async function moveTo(s, wid) {
  const ai = wid.startsWith('group:')
  if (!ai && s.status !== 'wait') { toast('This session is working. Move it after it stops.'); return }
  const r = await req('spyhop.move', { h: s.handle, wid }).catch(() => null)
  if (r) toast(ai ? 'Moved in Spyhop only. The Orca pane stays where it is.' : (r.result || 'Moved'))
  await load()
}

// ---------- 카드 끌어 옮기기 (보드와 같은 동작) ----------
// 누른 채 6px 넘게 움직이면 카드가 손을 따라온다. 다른 칸에 놓으면 옮기고, 끝의 점선 칸에 놓으면
// AI 주제는 새 칸 이름을 짓고(추천 이름 포함), 워크스페이스는 세션이 없는 워크스페이스를 고른다
let press = null, drag = null, justDragged = false
const findSession = (k) => (S.data && S.data.sessions || []).find((x) => key(x) === k)
function emptyWS() {
  const have = new Set([...document.querySelectorAll('.board .ws[data-wid]')].map((n) => n.dataset.wid))
  return (S.data.workspaces || []).filter((w) => !have.has(w.id) && !w.id.startsWith('group:'))
}
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || S.view !== 'list') return
  const c = e.target.closest && e.target.closest('.board .c')
  if (!c || e.target.closest('button')) return
  press = { k: c.dataset.k, x: e.clientX, y: e.clientY }
})
document.addEventListener('pointermove', (e) => {
  if (press && !drag && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 6) {
    const c = document.querySelector('.board .c[data-k="' + CSS.escape(press.k) + '"]'), s = findSession(press.k), p0 = press
    press = null
    if (c && s) startDrag(c, s, p0)
  }
  if (!drag) return
  e.preventDefault()
  drag.float.style.transform = 'translate(' + (e.clientX - drag.dx) + 'px,' + (e.clientY - drag.dy) + 'px) rotate(2deg)'
  const col = colAt(e.clientX, e.clientY)
  document.querySelectorAll('.ws.drop').forEach((n) => { if (n !== col) n.classList.remove('drop') })
  if (col && col !== drag.from) col.classList.add('drop')
  if (e.clientY > innerHeight - 50) window.scrollBy(0, 16); else if (e.clientY < 60) window.scrollBy(0, -16)
})
document.addEventListener('pointerup', (e) => {
  press = null
  if (!drag) return
  const d = drag; drag = null
  setTimeout(() => { justDragged = false }, 60)
  const col = colAt(e.clientX, e.clientY)
  document.querySelectorAll('.ws.drop').forEach((n) => n.classList.remove('drop'))
  d.float.remove(); d.el.classList.remove('dragging'); document.body.classList.remove('dragging-on')
  const ghost = document.querySelector('.ws.newcol')
  if (!col || col === d.from) { if (ghost) ghost.remove(); return }
  if (col.classList.contains('newcol')) { askNew(d.s, col.dataset.wid === 'pick:'); return }
  if (ghost) ghost.remove()
  moveTo(d.s, col.dataset.wid)
})
function colAt(x, y) { const n = document.elementFromPoint(x, y); return n && n.closest ? n.closest('.board .ws') : null }
function startDrag(c, s, p0) {
  const r = c.getBoundingClientRect(), f = c.cloneNode(true)
  f.classList.add('floating'); f.style.width = r.width + 'px'
  f.style.transform = 'translate(' + r.left + 'px,' + r.top + 'px)'
  document.body.appendChild(f)
  drag = { s, el: c, from: c.closest('.ws'), float: f, dx: p0.x - r.left, dy: p0.y - r.top }
  c.classList.add('dragging'); document.body.classList.add('dragging-on'); justDragged = true
  // 끝에 점선 칸 하나: AI 주제면 새 칸, 워크스페이스면 세션 없는 워크스페이스 고르기(오르카 밖 세션·작업 중이면 없음)
  const ai = (S.data.group_by || 'location') === 'ai', board = document.querySelector('.board')
  if (!board) return
  if (ai) board.append(el('div', { class: 'ws newcol', 'data-wid': 'group:' }, el('div', { class: 'wsh' }, '+ New column')))
  else if (s.status === 'wait' && !s.handle.startsWith('proc_') && emptyWS().length)
    board.append(el('div', { class: 'ws newcol', 'data-wid': 'pick:' }, el('div', { class: 'wsh' }, '+ Other workspace')))
}

// 새 칸 이름 짓기 / 워크스페이스 고르기 창
function askNew(s, pick) {
  S.dialog = true
  const close = () => { S.dialog = false; ov.remove(); const g = document.querySelector('.ws.newcol'); if (g) g.remove() }
  const ov = el('div', { class: 'ov', onclick: (e) => { if (e.target === ov) close() } })
  const box = el('div', { class: 'dlg' })
  ov.append(box); document.body.append(ov)
  if (pick) {
    const list = emptyWS(); let on = 0
    const rows = list.map((w, i) => el('button', { class: 'pk' + (i ? '' : ' on'), onclick: () => { on = i; rows.forEach((r, j) => r.classList.toggle('on', j === i)) }, ondblclick: () => done() },
      el('b', {}, w.name), w.path ? el('small', {}, w.path) : null))
    const done = () => { const w = list[on]; close(); if (w) moveTo(s, w.id) }
    box.append(el('h3', {}, 'Move to another workspace'), el('div', { class: 'pks' }, rows),
      el('div', { class: 'dbtns' }, el('button', { class: 'btn ghost', onclick: close }, 'Cancel'), el('button', { class: 'btn pri', onclick: done }, 'Move')))
    ov.tabIndex = -1; ov.focus()
    ov.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close(); else if (e.key === 'Enter') done()
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); on = Math.max(0, Math.min(rows.length - 1, on + (e.key === 'ArrowDown' ? 1 : -1))); rows.forEach((r, j) => r.classList.toggle('on', j === on)) }
    })
    return
  }
  const input = el('input', { class: 'nm', placeholder: 'Column name', spellcheck: 'false' })
  const chips = el('div', { class: 'chips' }, el('span', { class: 'mnote' }, 'Suggesting names…'))
  const done = () => {
    const name = input.value.split(/ +/).join(' ').trim(); close()
    if (!name) return
    const same = (S.data.workspaces || []).find((w) => w.id.startsWith('group:') && w.name.replace(/ /g, '').toLowerCase() === name.replace(/ /g, '').toLowerCase())
    moveTo(s, same ? same.id : 'group:' + name) // 같은 이름 칸이 있으면 그 칸으로
  }
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done() } else if (e.key === 'Escape') close() })
  box.append(el('h3', {}, 'New column'), input, chips,
    el('div', { class: 'dbtns' }, el('button', { class: 'btn ghost', onclick: close }, 'Cancel'), el('button', { class: 'btn pri', onclick: done }, 'Create')))
  setTimeout(() => input.focus(), 30)
  req('spyhop.suggest', { h: s.handle }).then((r) => {
    chips.replaceChildren(...(r.names || []).map((n) => el('button', { class: 'chip', onclick: () => { input.value = n; input.focus() } }, n)),
      ...(r.similar || []).map((n) => el('button', { class: 'chip old', title: 'Existing column', onclick: () => { input.value = n; input.focus() } }, n)))
  }).catch(() => chips.replaceChildren())
}
async function goTo(h) { const r = await req('spyhop.switch', { handle: h }).catch(() => null); if (r && !r.ok) toast('Could not open that session') }
async function endSession(h) {
  S.ask = ''
  const r = await req('spyhop.close', { handle: h }).catch(() => null)
  if (r && r.ok) { toast('Session ended'); if (S.view === 'detail') closeDetail() }
  await load()
}
async function toggle(log, t) {
  const done = t.state !== 'done'
  t.state = done ? 'done' : 'open'; render() // 바로 보이게 하고, 실패하면 다음 갱신에서 원래대로
  await req('spyhop.toggle', { log, label: t.label, done }).catch(() => null)
}

;(async () => { try { S.pal = (await orca.storage.get('palette')) || 'orca'; if (!PALETTES.some((p) => p[0] === S.pal)) S.pal = 'orca' } catch {} applyPal(); load() })()
setInterval(() => { if (document.visibilityState === 'visible') load() }, 5000)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load() })
document.addEventListener('click', () => { if (S.menu) { S.menu = false; render() } })
// 마우스 옆 버튼(뒤로 가기)으로 보드로 돌아간다
const mouseBack = (e) => { if (e.button === 3 && S.view === 'detail') { e.preventDefault(); closeDetail() } }
document.addEventListener('mouseup', mouseBack)
document.addEventListener('auxclick', (e) => { if (e.button === 3) e.preventDefault() })
// 트랙패드 두 손가락으로 오른쪽으로 쓸면 돌아간다(가로로 크게 움직일 때만)
let swipe = 0, swipeT = 0
document.addEventListener('wheel', (e) => {
  if (S.view !== 'detail' || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return
  if (Date.now() - swipeT > 300) swipe = 0
  swipeT = Date.now(); swipe += e.deltaX
  if (swipe < -140) { swipe = 0; closeDetail() }
}, { passive: true })
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (S.menu) { S.menu = false; render() } else if (S.view === 'detail') closeDetail()
})
</script>
</body>
